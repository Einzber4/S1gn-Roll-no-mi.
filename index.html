<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Roleta — Decision Engine</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main>

    <header>
      <div>
        <h1>ROLETA</h1>
        <p class="sub">Decision engine — projetos primeiro, distrações depois.</p>
      </div>

      <div class="header-controls">

        <div class="visual-tabs" role="tablist" aria-label="Configurações visuais">
          <button
            type="button"
            class="visual-tab active"
            data-tab="roulette"
          >
            Roleta
          </button>

          <button
            type="button"
            class="visual-tab"
            data-tab="visual"
          >
            Visual
          </button>
        </div>

        <div class="small muted">
          Persistência local automática
        </div>

      </div>
    </header>


    <div id="visualPanel" class="visual-panel hidden">

      <div class="visual-section">

        <div>
          <div class="small muted">Theme</div>
          <strong>Aparência</strong>
        </div>

        <div class="visual-options">

          <button
            type="button"
            class="visual-option"
            data-theme-option="midnight"
          >
            Midnight
          </button>

          <button
            type="button"
            class="visual-option"
            data-theme-option="dark"
          >
            Dark
          </button>

          <button
            type="button"
            class="visual-option"
            data-theme-option="light"
          >
            Light
          </button>

        </div>

      </div>


      <div class="visual-section">

        <div>
          <div class="small muted">Nitidez da UI</div>
          <strong>Interface</strong>
        </div>

        <div class="visual-options">

          <button
            type="button"
            class="visual-option"
            data-sharpness-option="soft"
          >
            Soft
          </button>

          <button
            type="button"
            class="visual-option"
            data-sharpness-option="balanced"
          >
            Balanced
          </button>

          <button
            type="button"
            class="visual-option"
            data-sharpness-option="crisp"
          >
            Crisp
          </button>

        </div>

      </div>

    </div>


    <div id="roulettePanel">

      <div class="grid">

        <!-- CATEGORIAS -->
        <section class="panel">
          <h2>Categorias</h2>

          <div id="cats" class="cats"></div>

          <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">

          <div class="small muted">Ciclo atual</div>
          <div id="progress" style="margin-top:5px"></div>
        </section>


        <!-- ROLETAS -->
        <section class="panel">

          <div class="row between">
            <div>
              <div class="small muted">Categoria selecionada</div>
              <h2 id="title">Jogos</h2>
              <div id="count" class="small muted"></div>
            </div>

            <button id="resetCycle">
              ↻ Novo ciclo
            </button>
          </div>


          <!-- ADICIONAR OPÇÃO -->
          <form id="addForm">
            <input
              id="newItem"
              placeholder="Adicionar opção..."
              autocomplete="off"
            >

            <button class="primary">
              + Adicionar
            </button>
          </form>


          <!-- LISTA -->
          <div id="list" class="list"></div>


          <!-- ROLETA -->
          <div class="center" style="margin-top:18px">

            <div class="wheel-wrap">
              <div class="pointer"></div>
              <div id="wheel" class="wheel"></div>
            </div>


            <!-- GIRAR -->
            <button
              id="spin"
              class="primary"
              style="font-size:17px;padding:12px 28px"
            >
              🎲 GIRAR
            </button>


            <!-- RESULTADO -->
            <div id="result" class="result">
              <span class="muted">Nenhum resultado.</span>
            </div>


            <!-- AÇÕES DO RESULTADO -->
            <div id="resultActions" class="actions hidden">

              <button id="confirm">
                ✓ Confirmar
              </button>

              <button id="reject">
                ↩ Rejeitar
              </button>

              <button id="cancel">
                ✕ Cancelar
              </button>

            </div>

          </div>

        </section>

      </div>

    </div>

  </main>


  <script src="js/app.js"></script>


  <!-- Sistema visual independente do app.js -->
  <script>
    (() => {

      const THEME_KEY = "einzbern-roulette-theme";
      const SHARPNESS_KEY = "einzbern-roulette-sharpness";

      const root = document.documentElement;

      const tabs = document.querySelectorAll(".visual-tab");
      const roulettePanel = document.getElementById("roulettePanel");
      const visualPanel = document.getElementById("visualPanel");

      const themeOptions =
        document.querySelectorAll("[data-theme-option]");

      const sharpnessOptions =
        document.querySelectorAll("[data-sharpness-option]");


      function applyTheme(theme) {
        const validThemes = ["midnight", "dark", "light"];

        if (!validThemes.includes(theme)) {
          theme = "midnight";
        }

        root.dataset.theme = theme;
        localStorage.setItem(THEME_KEY, theme);

        themeOptions.forEach(button => {
          button.classList.toggle(
            "active",
            button.dataset.themeOption === theme
          );
        });
      }


      function applySharpness(sharpness) {
        const validSharpness = ["soft", "balanced", "crisp"];

        if (!validSharpness.includes(sharpness)) {
          sharpness = "balanced";
        }

        root.dataset.sharpness = sharpness;
        localStorage.setItem(SHARPNESS_KEY, sharpness);

        sharpnessOptions.forEach(button => {
          button.classList.toggle(
            "active",
            button.dataset.sharpnessOption === sharpness
          );
        });
      }


      tabs.forEach(tab => {

        tab.addEventListener("click", () => {

          const target = tab.dataset.tab;

          tabs.forEach(item => {
            item.classList.toggle(
              "active",
              item === tab
            );
          });

          const visualActive = target === "visual";

          roulettePanel.classList.toggle(
            "hidden",
            visualActive
          );

          visualPanel.classList.toggle(
            "hidden",
            !visualActive
          );

        });

      });


      themeOptions.forEach(button => {

        button.addEventListener("click", () => {
          applyTheme(button.dataset.themeOption);
        });

      });


      sharpnessOptions.forEach(button => {

        button.addEventListener("click", () => {
          applySharpness(button.dataset.sharpnessOption);
        });

      });


      applyTheme(
        localStorage.getItem(THEME_KEY) || "midnight"
      );

      applySharpness(
        localStorage.getItem(SHARPNESS_KEY) || "balanced"
      );

    })();
  </script>

</body>
</html>
